spring.application.name=inventory-service
server.port=8082

spring.datasource.url=${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/inventorydb}
spring.datasource.username=${DB_USER:orderapp}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Existing databases without Flyway history must be explicitly baselined during upgrade.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=0

# Eureka Client Discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}