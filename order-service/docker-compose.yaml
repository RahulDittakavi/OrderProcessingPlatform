version: '3.8'

services:
  order-mongodb:
    image: mongo:7.0.5
    container_name: order-mongodb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: order-service
    volumes:
      - ./order-data:/data/db