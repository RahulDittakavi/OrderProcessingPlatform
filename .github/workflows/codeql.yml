name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Build services for CodeQL
        run: |
          set -e
          for service in api-gateway discovery-server product-service inventory-service order-service; do
            echo "::group::Building ${service}"
            if [ "$service" = "order-service" ]; then
              (cd "$service" && ./mvnw --batch-mode --no-transfer-progress -Dapi.version=1.40 -DskipTests package)
            else
              (cd "$service" && ./mvnw --batch-mode --no-transfer-progress -DskipTests package)
            fi
            echo "::endgroup::"
          done

      - name: Analyze
        uses: github/codeql-action/analyze@v3
