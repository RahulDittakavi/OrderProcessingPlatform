name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-check:
    name: Verify platform tooling
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/platform-check/go.mod
          cache-dependency-path: tools/platform-check/go.mod

      - name: Check Go formatting
        working-directory: tools/platform-check
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet and test platform checker
        working-directory: tools/platform-check
        run: |
          go vet ./...
          go test -race ./...

      - name: Check startup scripts
        run: bash -n start-all.sh stop-all.sh

  verify:
    name: Build and test services
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Verify all services
        run: |
          set -e
          for service in api-gateway discovery-server product-service inventory-service order-service; do
            echo "::group::Verifying ${service}"
            if [ "$service" = "order-service" ]; then
              (cd "$service" && ./mvnw --batch-mode --no-transfer-progress -Dapi.version=1.40 verify)
            else
              (cd "$service" && ./mvnw --batch-mode --no-transfer-progress verify)
            fi
            echo "::endgroup::"
          done
