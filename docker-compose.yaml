x-spring-healthcheck: &spring-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: ${DB_USER:-orderapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orderapp}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-create-databases.sh:ro
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  discovery-server:
    build:
      context: .
      args:
        SERVICE: discovery-server
    ports:
      - "8761:8761"
    networks:
      - platform-network
    healthcheck:
      <<: *spring-healthcheck
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent http://localhost:8761/actuator/health
          | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'

  product-service:
    build:
      context: .
      args:
        SERVICE: product-service
    environment:
      SERVER_PORT: 8080
      DB_USER: ${DB_USER:-orderapp}
      DB_PASSWORD: ${DB_PASSWORD:-orderapp}
      PRODUCT_DB_URL: jdbc:postgresql://postgres:5432/productdb
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: product-service
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - platform-network
    healthcheck:
      <<: *spring-healthcheck
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent http://localhost:8080/actuator/health
          | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'

  inventory-service:
    build:
      context: .
      args:
        SERVICE: inventory-service
    environment:
      SERVER_PORT: 8082
      DB_USER: ${DB_USER:-orderapp}
      DB_PASSWORD: ${DB_PASSWORD:-orderapp}
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/inventorydb
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: inventory-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - platform-network
    healthcheck:
      <<: *spring-healthcheck
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent http://localhost:8082/actuator/health
          | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'

  order-service:
    build:
      context: .
      args:
        SERVICE: order-service
    environment:
      SERVER_PORT: 8081
      DB_USER: ${DB_USER:-orderapp}
      DB_PASSWORD: ${DB_PASSWORD:-orderapp}
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/orderdb
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: order-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    networks:
      - platform-network
    healthcheck:
      <<: *spring-healthcheck
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent http://localhost:8081/actuator/health
          | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'

  api-gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
    ports:
      - "9000:9000"
    depends_on:
      discovery-server:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - platform-network
    healthcheck:
      <<: *spring-healthcheck
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent http://localhost:9000/actuator/health
          | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - platform-network

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - platform-network

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  platform-network:
    driver: bridge
